# Render Blueprint for Full-Stack Student CRUD Application
# Automatically provisions: PostgreSQL Database, Spring Boot Backend, and Vite React Frontend

services:
  # =========================================================================
  # 1. FRONTEND: Vite + React (JavaScript) Static Site
  # =========================================================================
  - type: web
    name: student-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: student-backend
          envVarKey: RENDER_EXTERNAL_URL

  # =========================================================================
  # 2. BACKEND: Spring Boot REST API (Java 21 / Docker)
  # =========================================================================
  - type: web
    name: student-backend
    runtime: docker
    rootDir: student
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: student-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: student-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: student-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: student-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: student-db
          property: password

# ===========================================================================
# 3. DATABASE: Managed PostgreSQL Database
# ===========================================================================
databases:
  - name: student-db
    plan: free
    databaseName: db_user
    user: student_user
